<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Styled Markdown Article</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css"
        />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=DejaVu+Sans:wght@400;700&family=DejaVu+Sans+Mono:wght@400;700&display=swap");

            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                font-family: "DejaVu Sans", sans-serif !important;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #0d1117;
                }
                :root {
                    --nav-bg: #161b22;
                    --nav-border: #30363d;
                    --nav-text: #f0f6fc;
                    --nav-link-hover: #58a6ff;
                    --meta-text: #8b949e;
                    --tag-bg: #21262d;
                    --tag-border: #30363d;
                }
            }
            @media (prefers-color-scheme: light) {
                body {
                    background-color: #ffffff;
                }
                :root {
                    --nav-bg: #f6f8fa;
                    --nav-border: #d0d7de;
                    --nav-text: #24292f;
                    --nav-link-hover: #0969da;
                    --meta-text: #57606a;
                    --tag-bg: #afb8c133;
                    --tag-border: transparent;
                }
            }
            .topbar {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                background-color: var(--nav-bg);
                border-bottom: 1px solid var(--nav-border);
                padding: 12px 24px;
            }
            .brand {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--nav-text);
                text-decoration: none;
                font-family: "DejaVu Sans Mono", monospace !important;
            }
            .nav-links {
                display: flex;
                gap: 24px;
                list-style: none;
                margin: 0;
                padding: 0;
            }
            .nav-links a {
                color: var(--nav-text);
                text-decoration: none;
                font-size: 0.95rem;
                font-weight: 500;
                transition: color 0.2s ease;
            }
            .nav-links a:hover {
                color: var(--nav-link-hover);
            }
            .markdown-body {
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px 24px;
                font-family: "DejaVu Sans", sans-serif !important;
            }

            .article-header {
                margin-bottom: 2rem;
                padding-bottom: 1.5rem;
                border-bottom: 1px solid var(--nav-border);
            }
            .article-title {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
                font-weight: 700;
            }
            .article-meta {
                color: var(--meta-text);
                font-size: 0.9rem;
                margin-bottom: 1rem;
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
            }
            .article-tags {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .article-tag {
                background-color: var(--tag-bg);
                border: 1px solid var(--tag-border);
                padding: 2px 8px;
                border-radius: 2em;
                font-size: 0.8rem;
                color: var(--nav-text);
                font-family: "DejaVu Sans Mono", monospace;
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <a href="#" class="brand">*NIX_Club</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="./home.html">Home</a></li>
                    <li><a href="./guides.html">Guides</a></li>
                    <li><a href="./people.html">People & Contact</a></li>
                </ul>
            </nav>
        </header>

        <div id="content" class="markdown-body"></div>

        <script type="text/markdown" id="markdown-source"># Home

We are a club.
</script>

        <script>
const markdownRaw = document.getElementById("markdown-source").textContent;
document.getElementById("content").innerHTML =
marked.parse(markdownRaw);

        </script>
    </body>
</html>
