<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{TITLE}}</title>
        <script
            src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.min.js"
            integrity="sha384-8HQHvnL5BVAFLDR9zSYfuygnBnO3Y3gB3PF2sahr8aZGR6m48yPhZxm9JTjWnC0l"
            crossorigin="anonymous"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css"
            integrity="sha512-Ya9H+OPj8NgcQk34nCrbehaA0atbzGdZCI2uCbqVRELgnlrh8vQ2INMnkadVMSniC54HChLIh5htabVuKJww8g=="
            crossorigin="anonymous"
        />
        <style>
            @font-face {
                font-family: 'DejaVu Sans';
                font-style: normal;
                font-weight: 400;
                src: local('DejaVu Sans'),
                    local('DejaVuSans');
            }

            @font-face {
                font-family: 'DejaVu Sans';
                font-style: normal;
                font-weight: 700;
                src: local('DejaVu Sans Bold'),
                    local('DejaVuSans-Bold');
            }

            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                font-family: "DejaVu Sans", sans-serif;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #0d1117;
                }
                :root {
                    --nav-bg: #161b22;
                    --nav-border: #30363d;
                    --nav-text: #f0f6fc;
                    --nav-link-hover: #58a6ff;
                    --meta-text: #8b949e;
                    --tag-bg: #21262d;
                    --tag-border: #30363d;
                }
            }
            @media (prefers-color-scheme: light) {
                body {
                    background-color: #ffffff;
                }
                :root {
                    --nav-bg: #f6f8fa;
                    --nav-border: #d0d7de;
                    --nav-text: #24292f;
                    --nav-link-hover: #0969da;
                    --meta-text: #57606a;
                    --tag-bg: #afb8c133;
                    --tag-border: transparent;
                }
            }
            .topbar {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                background-color: var(--nav-bg);
                border-bottom: 1px solid var(--nav-border);
                padding: 12px 24px;
                position: sticky;
                top: 0;
                z-index: 100;
            }
            .brand {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--nav-text);
                text-decoration: none;
                font-family: "DejaVu Sans Mono", monospace !important;
            }
            .nav-links {
                display: flex;
                gap: 24px;
                list-style: none;
                margin: 0;
                padding: 0;
            }
            .nav-links a {
                color: var(--nav-text);
                text-decoration: none;
                font-size: 0.95rem;
                font-weight: 500;
                transition: color 0.2s ease;
            }
            .nav-links a:hover {
                color: var(--nav-link-hover);
            }
            .markdown-body {
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px 24px;
                font-family: "DejaVu Sans", sans-serif !important;
                color: var(--nav-text);
            }

            .markdown-body p,
            .markdown-body li {
                font-size: 16px !important;
                line-height: 1.5 !important;
            }

            /* Ensure headings in custom HTML match GitHub's markdown heading weights */
            .markdown-body h1, .markdown-body h2, .markdown-body h3 {
                margin-top: 24px;
                margin-bottom: 16px;
                font-weight: 600;
                line-height: 1.25;
            }

            .markdown-body h2 {
                font-size: 1.5em;
                border-bottom: 1px solid var(--nav-border);
                padding-bottom: .3em;
            }

            .markdown-body h3 {
                font-size: 1.25em;
            }

            /* Card titles reuse <h2> for semantics but shouldn't look like a markdown heading */
            .markdown-body h2.article-card-title {
                border-bottom: none;
                padding-bottom: 0;
                margin-top: 0;
                margin-bottom: 8px;
                font-size: 1.25rem;
            }

            .article-card-footer {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px;
            }

            .article-card-footer .article-tags {
                margin-left: auto;
            }

            .article-header {
                padding-bottom: 1rem;
                /*border-bottom: 1px solid var(--nav-border);*/
            }
            .article-title {
                margin-top: 0 !important;
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
                font-weight: 700;
            }
            .article-meta {
                color: var(--meta-text);
                font-size: 0.9rem;
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
            }
            .article-tags {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .article-tag {
                background-color: var(--tag-bg);
                border: 1px solid var(--tag-border);
                padding: 2px 8px;
                border-radius: 2em;
                font-size: 0.8rem;
                color: var(--nav-text);
                font-family: "DejaVu Sans Mono", monospace;
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <a class="brand" href="{{ROOT}}index.html">*NIX_Club</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="{{ROOT}}index.html">Home</a></li>
                    <li><a href="{{ROOT}}articles.html">Guides & Articles</a></li>
                    <li><a href="{{ROOT}}people.html">People & Contact</a></li>
                </ul>
            </nav>
        </header>

        <div id="content" class="markdown-body">
            {{BODY_SLOT}}
        </div>
        <script>
{{JS}}
        </script>
    </body>
</html>
